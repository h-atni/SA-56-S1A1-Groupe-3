name: CI/CD

on:
  push:
    branches-ignore:
      - 'no-ga/**'
    tags:
      - 'v*'
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - 'no-ga/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_style:
    name: Lint HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: W3C HTML5 Validator
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: './'

  sync_to_bitbucket:
    name: Mirror to Bitbucket
    if: github.event_name == 'push' && github.repository != 'aconchin/sa-56-s1a1-groupe-3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push to Bitbucket
        env:
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add bitbucket https://x-token-auth:${BITBUCKET_TOKEN}@bitbucket.org/aconchin/sa-56-s1a1-groupe-3
          git push bitbucket ${GITHUB_REF} --force
