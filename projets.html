<body>
    <nav class="navigation">
        <div class="menu-container">
            <input type="checkbox" id="menu-toggle" class="menu-checkbox">
            <label for="menu-toggle" class="menu-button">=</label>

            <div class="menu-links">
                <a href="index.html">Accueil</a>
                <a href="presentation.html">Présentation</a>
                <a href="economy.html">Economie</a>
                <a href="projets.html" class="active">Realisations</a>
                <a href="team.html">Forticher</a>
            </div>
        </div>
        <img src="./assets/fortiche_blanc.gif" alt="Logo fortiche" class="nav-gif">
        <div class="nav-spacer"></div>
    </nav>
    <div class="carousel" id="carousel">

        <div class="carousel-track" id="track">

            <div class="slide", src="./assets/projet.png">
                Projet 1
            </div>

            <div class="slide">
                Projet 2
            </div>

            <div class="slide">
                Projet 3
            </div>

            <div class="slide">
                Projet 4
            </div>

        </div>

        <button class="arrow prev" onclick="moveSlide(-1)" aria-label="Projet précédent">
            &#10094;
        </button>

        <button class="arrow next" onclick="moveSlide(1)" aria-label="Projet suivant">
            &#10095;
        </button>
        <div class="dots" id="dots"></div>

    </div>

    <script>
        const track = document.getElementById('track');
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dots');

        let index = 0;
        let autoplayInterval;

        slides.forEach((_, i) => {
            const dot = document.createElement('button');
            dot.classList.add('dot');
            if (i === 0) {
                dot.classList.add('active');
            }
            dot.addEventListener('click', () => {
                goToSlide(i);
            });
            dotsContainer.appendChild(dot);
        });
        const dots = document.querySelectorAll('.dot');
        function updateSlide() {
            track.style.transform =
                `translateX(-${index * 100}%)`;

            dots.forEach(dot => {
                dot.classList.remove('active');
            });
            dots[index].classList.add('active');
        }
        function moveSlide(direction) {
            index =
                (index + direction + slides.length)
                % slides.length;
            updateSlide();
            resetAutoplay();
        }
        function goToSlide(i) {
            index = i;
            updateSlide();
            resetAutoplay();
        }
        function startAutoplay() {
            autoplayInterval = setInterval(() => {
                moveSlide(1);
            }, 4000);
        }
        function resetAutoplay() {
            clearInterval(autoplayInterval);
            startAutoplay();
        }
        startAutoplay();
    </script>
    <footer>
        <p>Hicham Atni</p>
    </footer>

</body>
